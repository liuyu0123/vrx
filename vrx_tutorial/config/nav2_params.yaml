amcl:
  ros__parameters:
    use_sim_time: True
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "wamv/wamv/base_link"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: /wamv/sensors/lidars/lidar_wamv_sensor/scan

bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_base_frame: wamv/wamv/base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    # 'default_nav_through_poses_bt_xml' and 'default_nav_to_pose_bt_xml' are use defaults:
    # nav2_bt_navigator/navigate_to_pose_w_replanning_and_recovery.xml
    # nav2_bt_navigator/navigate_through_poses_w_replanning_and_recovery.xml
    # They can be set here or via a RewrittenYaml remap from a parent launch file to Nav2.
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_rate_controller_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_is_path_valid_condition_bt_node

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: True

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: True

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # Tightened so a stuck-against-obstacle boat triggers controller
      # failure -> BT recovery (which includes BackUp/Spin) within ~15s
      # instead of pushing the obstacle for 30s. Still loose enough for
      # the WAM-V's slow startup acceleration.
      required_movement_radius: 0.2
      movement_time_allowance: 15.0
    # Goal checker parameters
    #precise_goal_checker:
    #  plugin: "nav2_controller::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 2.0
      yaw_goal_tolerance: 0.5
    # Regulated Pure Pursuit: forward-only controller designed for
    # car-like / boat-like robots. Unlike DWB it never tries to align
    # heading before moving; it picks a lookahead point on the path
    # and steers toward it while continuously moving forward, which
    # matches the WAM-V's high-inertia dynamics.
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      # --- speed ---
      desired_linear_vel: 2.0
      min_approach_linear_velocity: 0.3
      approach_velocity_scaling_dist: 4.0

      # --- lookahead (the "steering wheel") ---
      # Pure pursuit's heading control is effectively P-only with
      # gain ~ 1/lookahead. To damp the WAM-V's heading wobble, look
      # FURTHER ahead: larger lookahead = lower gain = smoother yaw.
      # If the boat is too sluggish to follow tight curves after this,
      # cut lookahead_time first.
      use_velocity_scaled_lookahead_dist: true
      lookahead_time: 3.0
      lookahead_dist: 8.0
      min_lookahead_dist: 6.0
      max_lookahead_dist: 15.0

      # --- regulation: slow down in tight turns and near obstacles ---
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 4.0
      regulated_linear_scaling_min_speed: 0.5
      # Distance from inflated obstacle where RPP starts cost-based
      # slowdown. Was 1.0 -> boat braked too late and ploughed into
      # banks. 3.0 m + ~1 m/s^2 max_decel gives ~2 m headroom.
      cost_scaling_dist: 3.0
      cost_scaling_gain: 0.5
      # MUST match local_costmap inflation_layer.cost_scaling_factor.
      # Both lowered 1.5 -> 0.8 to widen the inflation buffer.
      inflation_cost_scaling_factor: 0.8

      # --- THE key boat-vs-roomba switch ---
      # use_rotate_to_heading=false means RPP never stops to spin to
      # the desired heading at start, only steers while moving.
      use_rotate_to_heading: false
      rotate_to_heading_angular_vel: 0.5
      rotate_to_heading_min_angle: 0.785
      # Lowered 1.0 -> 0.4 to damp yaw oscillation. Pure pursuit has
      # no D term; clamping how fast the steering rate can change is
      # the cheap way to add damping.
      max_angular_accel: 0.4

      # WAM-V cannot reverse cleanly with a rudder; keep it forward only.
      allow_reversing: false

      # --- collision check on the carrot arc ---
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.5

      transform_tolerance: 0.5
      max_robot_pose_search_dist: 10.0
      use_interpolation: true

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: wamv/wamv/base_link
      use_sim_time: True
      rolling_window: true
      width: 40
      height: 40
      resolution: 0.1
      # WAM-V hull is ~2.4 x 4.8 m; a 2.0 m circle clipped corners
      # of the boat just outside inflation. Use the longest half-extent.
      robot_radius: 2.5
      plugins: ["obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # cost_scaling_factor controls the exp(-k*d) decay of the
        # inflation cost. 1.5 had cost ~3 at 5 m -> negligible push.
        # 0.8 gives cost ~23 at 5 m and ~114 at 3 m past inscribed
        # radius, so the planner sees a real gradient many meters
        # out and routes paths down the middle of channels instead
        # of along the walls. MUST stay matched with RPP's
        # inflation_cost_scaling_factor (see controller_server).
        cost_scaling_factor: 0.8
        inflation_radius: 8.0
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        # Use the 3D PointCloud2 topic, NOT the 2D /scan. The /scan
        # collapses 16 vertical beams to a single LaserScan and the
        # downward beams (-15 deg) hit the water at ~7 m, producing
        # a phantom ring of obstacles around the boat. PointCloud2
        # gives us per-point z so we can keep only points above the
        # water surface.
        observation_sources: pointcloud
        pointcloud:
          topic: /wamv/sensors/lidars/lidar_wamv_sensor/points
          data_type: "PointCloud2"
          clearing: True
          marking: True
          # WAM-V deck/lidar sit at z=1.8 m. Walls reach up to z=2.0 m
          # (3 m tall, base at z=-1). Filter water-surface noise by
          # requiring at least 0.5 m above the waterline; cap above
          # the lidar to ignore rain/spray.
          min_obstacle_height: 0.5
          max_obstacle_height: 3.0
          # Lidar can see 130 m. Mark out to 30 m so the boat sees
          # banks/buoys with enough headroom (max 2 m/s, ~1 m/s^2
          # decel = ~2 m braking distance) but the costmap doesn't
          # get cluttered by far-field detections that change every
          # frame. Raytrace goes a bit further so cells become free
          # as soon as they're observed clear.
          raytrace_max_range: 50.0
          raytrace_min_range: 0.0
          obstacle_max_range: 30.0
          # CRITICAL: filter out self-detections. The lidar at z=1.8
          # sees parts of the WAM-V's own deck/superstructure (z>0.5)
          # at <3 m horizontal range. Without this, the boat marks
          # itself, and as it moves, those marks aren't always cleared
          # (rays end at the self-hit, no clearing past it), leaving
          # a black trail in the costmap. Boat half-extents from the
          # lidar are ~3.1 m back x 1.2 m side -> 3.5 m gives margin.
          obstacle_min_range: 3.5
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: wamv/wamv/base_link
      use_sim_time: True
      robot_radius: 2.5
      resolution: 0.2
      # Was true: every cell defaults to UNKNOWN until the lidar
      # observes it, which combined with the phantom-water-ring
      # left huge swaths of open water marked unknown -> high cost.
      # On open water the safe assumption is "no observation = free".
      track_unknown_space: false
      rolling_window: true
      width: 500
      height: 500
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: pointcloud
        pointcloud:
          topic: /wamv/sensors/lidars/lidar_wamv_sensor/points
          data_type: "PointCloud2"
          clearing: True
          marking: True
          min_obstacle_height: 0.5
          max_obstacle_height: 3.0
          raytrace_max_range: 50.0
          raytrace_min_range: 0.0
          obstacle_max_range: 30.0
          # Same self-detection filter as local_costmap. See the
          # comment there for why 3.5 m.
          obstacle_min_range: 3.5
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 0.8
        inflation_radius: 8.0
      always_send_full_costmap: True

map_server:
  ros__parameters:
    use_sim_time: True
    # Overridden in launch by the "map" launch configuration or provided default value.
    # To use in yaml, remove the default "map" value in the tb3_simulation_launch.py file & provide full path to map below.
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 1.0
      # A* picks paths through the cost gradient instead of the
      # equipotential Dijkstra ridges that produce wall-hugging.
      use_astar: true
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: wamv/wamv/base_link
    transform_tolerance: 0.1
    use_sim_time: true
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

robot_state_publisher:
  ros__parameters:
    use_sim_time: True

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    # Was [0.26, 0.0, 1.0] (turtlebot3 default) which capped the
    # USV at 0.26 m/s. Match RPP's desired_linear_vel and the
    # WAM-V's reachable speed.
    max_velocity: [2.5, 0.0, 0.7]
    min_velocity: [-1.0, 0.0, -0.7]
    # Angular accel matches RPP max_angular_accel so the smoother
    # never lets through a faster yaw-rate change than RPP intended.
    # max_decel longitudinal raised 0.6 -> 1.0 so the boat brakes
    # hard when the cost-regulator commands it (riverbank avoidance);
    # the H-config thrusters can pull >2 m/s^2 reverse, so 1.0 isn't
    # the limit, the boat's mass-vs-thrust ratio is.
    max_accel: [0.6, 0.0, 0.4]
    max_decel: [-1.0, 0.0, -0.4]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
